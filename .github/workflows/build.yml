# Builds the Windows MSI, the macOS .dmg and the Debian/Ubuntu .deb.
#   - every push and pull request: build and test (files kept as workflow artifacts)
#   - a pushed tag like v0.4.0: also a *draft* release with the three files attached,
#     to review and publish by hand
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cargo test --release
      - run: ./packaging/windows/build-msi.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: sh packaging/macos/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    # the oldest supported Ubuntu, so the package also runs on Ubuntu 22.04+, Debian 12+ and Linux Mint 21+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sh packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  # installs the .deb on clean Debian, Ubuntu and Linux Mint, runs the command line
  # on a sample session folder, and starts the tray on a virtual display
  linux-install-test:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "linuxmintd/mint22-amd64"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - run: docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" sh packaging/linux/install-test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --draft --title "CCDC ${GITHUB_REF_NAME#v}" --notes "Draft: replace with the release notes."
